name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: https://www.npmjs.com/package/@santi020k/og/v/${{ inputs.version }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/og/package.json').version")

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match requested release $RELEASE_VERSION."
            exit 1
          fi

          if ! node -e "process.exit(/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$RELEASE_VERSION"; then
            echo "Release version $RELEASE_VERSION is not valid SemVer."
            exit 1
          fi

          if npm view "@santi020k/og@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@santi020k/og@$RELEASE_VERSION is already published."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Validate release candidate
        run: pnpm run validate

      - name: Publish package
        working-directory: packages/og
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm publish --access public --no-git-checks

      - name: Verify published package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          MAX_ATTEMPTS=30

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            PUBLISHED_VERSION=$(npm view "@santi020k/og@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$PUBLISHED_VERSION" = "$RELEASE_VERSION" ]; then
              echo "Verified @santi020k/og@$RELEASE_VERSION in the npm registry."
              exit 0
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi

            echo "Registry verification attempt $attempt/$MAX_ATTEMPTS did not find the package yet; retrying in 10 seconds."
            sleep 10
          done

          echo "The npm registry did not return @santi020k/og@$RELEASE_VERSION after five minutes."
          exit 1

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "v$RELEASE_VERSION"
