name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: 1.2.2
        type: string
      revalidate:
        description: Repeat full validation even when CI already passed for this commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://www.npmjs.com/package/@santi020k/og/v/${{ inputs.version }}
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          pnpm-version: 10.32.1
          node-version: 22
          task-cache-path: .turbo/cache
          task-cache-key: og-tasks

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - name: Set up npm publishing client
        run: |
          npm install --global npm@12.2.0
          npm --version

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must run from merged main."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./packages/og/package.json').version")

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Package version $PACKAGE_VERSION does not match requested release $RELEASE_VERSION."
            exit 1
          fi

          if ! node -e "process.exit(/^\\d+\\.\\d+\\.\\d+(-[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)" "$RELEASE_VERSION"; then
            echo "Release version $RELEASE_VERSION is not valid SemVer."
            exit 1
          fi

          if npm view "@santi020k/og@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@santi020k/og@$RELEASE_VERSION is already published."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      # The CI push run on main already ran the full gate on Node.js 22 and 24 and the packed
      # consumers for this exact commit. Without that confirmed result, both steps run here.
      - name: Look for a successful CI run on this commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/og/scripts/verify-ci-evidence.mjs

      - name: Validate release candidate
        if: inputs.revalidate || steps.ci.outputs.trusted != 'true'
        run: pnpm run validate

      - name: Test packed release candidate in consumers
        if: inputs.revalidate || steps.ci.outputs.trusted != 'true'
        run: pnpm run test:consumers

      - name: Audit release dependencies
        run: pnpm audit --audit-level moderate

      # prepack always rebuilds and validates the package that is published.

      - name: Publish package
        working-directory: packages/og
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public

      - name: Verify published package
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Ask the registry directly: the exact version document and the install
          # manifest that the consumer test resolves next. Back off from 2 to 10 seconds.
          REGISTRY_PACKAGE=https://registry.npmjs.org/@santi020k%2fog
          DEADLINE=$((SECONDS + 300))
          DELAY=2

          published() {
            curl --fail --silent --show-error --max-time 15 "$REGISTRY_PACKAGE/$RELEASE_VERSION" \
              | jq --exit-status --arg version "$RELEASE_VERSION" '.version == $version' >/dev/null \
              && curl --fail --silent --show-error --max-time 15 \
                --header 'Accept: application/vnd.npm.install-v1+json' "$REGISTRY_PACKAGE" \
              | jq --exit-status --arg version "$RELEASE_VERSION" '.versions[$version].version == $version' >/dev/null
          }

          until published; do
            if [ $((SECONDS + DELAY)) -gt "$DEADLINE" ]; then
              echo "The npm registry did not return @santi020k/og@$RELEASE_VERSION after five minutes."
              exit 1
            fi

            echo "Registry does not list @santi020k/og@$RELEASE_VERSION yet; retrying in $DELAY seconds."
            sleep "$DELAY"
            DELAY=$((DELAY * 2 > 10 ? 10 : DELAY * 2))
          done

          echo "Verified @santi020k/og@$RELEASE_VERSION in the npm registry."

      - name: Test registry package in consumers
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm --filter @santi020k/og run test:consumers -- --version "$RELEASE_VERSION"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "v$RELEASE_VERSION"
