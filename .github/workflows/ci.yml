name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          pnpm-version: 10.32.1
          node-version: 22
      - run: node --test .github/scripts/website-inputs.test.mjs
      - run: pnpm run validate

  validate-node-24:
    name: Validate on Node.js 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          pnpm-version: 10.32.1
          node-version: 24
      - run: pnpm run validate

  consumer-smoke:
    needs: [validate, validate-node-24]
    name: Test packed Astro, Next.js, and Node consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          pnpm-version: 10.32.1
          node-version: 22
      - run: pnpm --filter @santi020k/og build
      - run: pnpm run test:consumers

  website-scope:
    name: Detect website changes
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check website paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if bash .github/scripts/website-inputs.sh "$BASE_SHA" "$GITHUB_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then exit "$status"; fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


  deploy-website:
    name: Deploy website
    needs: [validate, validate-node-24, consumer-smoke, website-scope]
    if: needs.website-scope.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit
