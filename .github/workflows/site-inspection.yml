name: Production metadata score

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: ${{ matrix.name }} scores 100
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aaronmgz
            url: https://aaronmgz.com
          - name: Astro Doctor
            url: https://doctor.santi020k.com
          - name: Between Contractions
            url: https://between.santi020k.com
          - name: Commitprompt
            url: https://commitprompt.santi020k.com
          - name: Cult
            url: https://cult.santi020k.com
          - name: ESLint Config
            url: https://eslint.santi020k.com
          - name: Lumen UI
            url: https://lumen.santi020k.com
          - name: Open Graph
            url: https://og.santi020k.com
          - name: PostLens
            url: https://postlens.santi020k.com
          - name: Quality
            url: https://quality.santi020k.com
          - name: santi020k.com
            url: https://santi020k.com
          - name: Santi020k Theme
            url: https://theme.santi020k.com
          - name: Workscene
            url: https://workscene.santi020k.com
    steps:
      - uses: actions/checkout@v6
      - name: Set up cached package toolchain
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          pnpm-version: 10.32.1
          node-version: 22
          task-cache-path: .turbo/cache
          task-cache-key: og-tasks
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - run: pnpm exec turbo run build --filter=@santi020k/og
      - name: Inspect production metadata
        env:
          SITE_URL: ${{ matrix.url }}
        run: |
          inspection_status=0
          node packages/og/dist/cli.js inspect "$SITE_URL" --json > inspection.json || inspection_status=$?

          # Metadata errors still produce a report; print its diagnostics before failing.
          if [ "$inspection_status" -ne 0 ] && [ ! -s inspection.json ]; then
            exit "$inspection_status"
          fi

          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const inspection = JSON.parse(await readFile('inspection.json', 'utf8'))

          console.log(`Score ${inspection.score}/100 for ${inspection.finalUrl}`)

          if (inspection.score !== 100) {
            for (const check of inspection.checks) {
              if (check.status !== 'pass') console.error(`${check.status}: ${check.code} — ${check.message}`)
            }

            process.exitCode = 1
          }
          NODE
